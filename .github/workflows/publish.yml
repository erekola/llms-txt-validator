name: publish

# Publish to npm with provenance using npm Trusted Publishing (OIDC).
# No NPM_TOKEN is stored: a short-lived credential is minted from GitHub's
# OIDC token at publish time, and npm attaches a signed provenance attestation
# (public repo + public package). Requires npm >= 11.5.1, which ships with
# Node 24, and a Trusted Publisher configured for this package on npmjs.com
# (workflow filename must be exactly publish.yml).
#
# Triggers when a version tag is pushed, e.g. v0.1.3.
#
# Four jobs, so that the permission that lets npm mint a token (id-token: write)
# belongs to a job that runs no checkout, no install and no tests:
#   test     the same matrix as ci.yml. Read access only. A red entry stops the release.
#   build    needs test. Read access only. Checks the tag against package.json, packs the
#            tarball once and hands it over as an artifact; the sha256 of that file is a
#            job output and ties the jobs together.
#   publish  needs build. Holds id-token: write and nothing else. No checkout. Checks the
#            sha256 of the downloaded tarball against the build output, then publishes it.
#   release  needs build and publish. Holds contents: write and creates the GitHub release.
# A flaky red test entry only delays a release; nothing unverified reaches npm.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    # Same matrix and commands as ci.yml (see the comment there for why Windows and Node 24).
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22, 24, 26]
        include:
          - os: windows-latest
            node: 22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      # The tag says which version is being published, npm publishes what package.json
      # says, and nothing compared the two. A tag written by hand can therefore publish
      # a different version than it names, and the release notes below would still be
      # cut from the CHANGELOG section of the tag. This fails the run instead.
      - name: The tag and package.json must name the same version
        shell: bash
        run: |
          set -euo pipefail
          pkg=$(node -p "require('./package.json').version")
          if [ "v$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi
      - run: npm ci --ignore-scripts
      - name: Pack the tarball once
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-pack
          # prepack builds dist/ before the tarball is written.
          npm pack --pack-destination release-pack
          TARBALL="$(node -p "require('./package.json').name + '-' + require('./package.json').version + '.tgz'")"
          test -f "release-pack/$TARBALL"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "release-pack/$TARBALL" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Release notes from CHANGELOG
        shell: bash
        run: |
          set -euo pipefail
          awk -v v="${GITHUB_REF_NAME#v}" 'index($0, "## " v " ") == 1 { f = 1; next } /^## / { f = 0 } f' CHANGELOG.md > release-pack/notes.md
          if [ ! -s release-pack/notes.md ]; then echo "See CHANGELOG.md." > release-pack/notes.md; fi
      - name: Hand the tarball and the release notes to the next jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-pack
          path: release-pack
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write   # required: lets the job mint the OIDC token for npm
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-pack
          path: release-pack
      - name: Check that the tarball is the file the build job packed
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
          EXPECTED: ${{ needs.build.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(sha256sum "release-pack/$TARBALL" | cut -d' ' -f1)"
          if [ -z "$EXPECTED" ] || [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "release-pack/$TARBALL has sha256 $ACTUAL, the build job packed $EXPECTED; nothing was published" >&2
            exit 1
          fi
      - name: Publish the tarball to npm
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
        shell: bash
        run: |
          set -euo pipefail
          # The leading ./ is required: npm reads dir/name.tgz without it as a GitHub shorthand.
          npm publish "./release-pack/$TARBALL" --provenance --access public

  release:
    # The tag is also a release. Without this the repository shows tags and
    # no versions, and the CHANGELOG entry stays invisible on GitHub.
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # required: lets this job create the GitHub release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-pack
          path: release-pack
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" --title "${GITHUB_REF_NAME#v}" --notes-file release-pack/notes.md
