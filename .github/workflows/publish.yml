name: publish

# Publish to npm with provenance using npm Trusted Publishing (OIDC).
# No NPM_TOKEN is stored: a short-lived credential is minted from GitHub's
# OIDC token at publish time, and npm attaches a signed provenance attestation
# automatically (public repo + public package). Requires npm >= 11.5.1, which
# ships with Node 24, and a Trusted Publisher configured for this package on
# npmjs.com (workflow filename must be exactly publish.yml).
#
# Triggers when a version tag is pushed, e.g. v0.1.3.

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write   # required: lets the job mint the OIDC token for npm
  contents: write   # required: lets the last step create the GitHub release

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm test
      - run: npm publish

      # The tag is also a release. Without this the repository shows tags and
      # no versions, and the CHANGELOG entry stays invisible on GitHub.
      - name: Release notes from CHANGELOG
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" 'index($0, "## " v " ") == 1 { f = 1; next } /^## / { f = 0 } f' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then echo "See CHANGELOG.md." > release-notes.md; fi
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "${GITHUB_REF_NAME#v}" --notes-file release-notes.md
